<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Arial, sans-serif">
  <rect width="920" height="420" fill="#f8fafc"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#0f172a">JobBoard — Request Flow Architecture</text>

  <rect x="20" y="60" width="180" height="300" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="110" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Browser</text>
  <text x="110" y="120" text-anchor="middle" font-size="12" fill="#334155">Guest storefront</text>
  <text x="110" y="145" text-anchor="middle" font-size="12" fill="#334155">Candidate dashboards</text>
  <text x="110" y="170" text-anchor="middle" font-size="12" fill="#334155">Employer workspace</text>
  <text x="110" y="195" text-anchor="middle" font-size="12" fill="#334155">Admin panel</text>

  <rect x="260" y="60" width="240" height="300" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Next.js App Router</text>
  <text x="380" y="115" text-anchor="middle" font-size="12" fill="#334155">RSC public pages (SEO, JSON-LD)</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" fill="#334155">Route handlers /api/*</text>
  <text x="380" y="165" text-anchor="middle" font-size="12" fill="#334155">auth-guards + rate-limit</text>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#334155">NextAuth v4 (JWT, 3 roles)</text>
  <text x="380" y="225" text-anchor="middle" font-size="12" fill="#1d4ed8">search.ts (FTS builder)</text>
  <text x="380" y="250" text-anchor="middle" font-size="12" fill="#1d4ed8">job/application state machines</text>
  <text x="380" y="275" text-anchor="middle" font-size="12" fill="#1d4ed8">upload validation (magic bytes)</text>
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#1d4ed8">email.ts (Resend + EmailLog)</text>

  <rect x="560" y="60" width="150" height="300" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="635" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">PostgreSQL</text>
  <text x="635" y="115" text-anchor="middle" font-size="12" fill="#334155">11 Prisma models</text>
  <text x="635" y="140" text-anchor="middle" font-size="12" fill="#334155">searchVector (GIN)</text>
  <text x="635" y="165" text-anchor="middle" font-size="12" fill="#334155">salaryMonthlyCents</text>
  <text x="635" y="190" text-anchor="middle" font-size="12" fill="#334155">unique (job,candidate)</text>
  <text x="635" y="215" text-anchor="middle" font-size="12" fill="#334155">14 indexes</text>

  <rect x="760" y="60" width="140" height="130" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="830" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Storage</text>
  <text x="830" y="110" text-anchor="middle" font-size="12" fill="#334155">S3 private</text>
  <text x="830" y="130" text-anchor="middle" font-size="12" fill="#334155">Cloudinary raw</text>
  <text x="830" y="150" text-anchor="middle" font-size="12" fill="#334155">local (HMAC links)</text>

  <rect x="760" y="230" width="140" height="90" rx="10" fill="#fae8ff" stroke="#c026d3"/>
  <text x="830" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Resend</text>
  <text x="830" y="280" text-anchor="middle" font-size="12" fill="#334155">welcome / applied</text>
  <text x="830" y="300" text-anchor="middle" font-size="12" fill="#334155">status-changed + log</text>

  <line x1="200" y1="200" x2="260" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="200" x2="560" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="110" x2="760" y2="110" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="500" y1="285" x2="760" y2="275" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b"/>
    </marker>
  </defs>
  <text x="760" y="330" font-size="11" fill="#64748b">signed URLs ≤120s, authz matrix</text>
</svg>
